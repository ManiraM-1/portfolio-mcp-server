# Server
# Render (and most PaaS hosts) inject a PORT env var and route traffic to
# whatever port the app actually binds to — they don't respect EXPOSE in the
# Dockerfile. Falls back to 8081 for local dev / local `docker run`.
server.port=${PORT:8081}

# PostgreSQL / PGVector (Supabase)
# Uses Supabase's Session Pooler (not the direct connection) because the
# direct-connection host is IPv6-only, which fails to connect from Docker
# containers and from most PaaS hosts (Render, Hugging Face) — both are
# IPv4-only networks.
# No real values are baked in here. These must always come from real
# environment variables — set them in your shell for local runs (see
# .env.example) and as secrets in the Render dashboard for production.
# There is deliberately no fallback default: better to fail loudly at
# startup than silently connect to nothing.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# PGVector store — Spring AI creates the table automatically
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.dimensions=768
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE

# Google Gemini
spring.ai.google.genai.api-key=${SPRING_AI_GOOGLE_GENAI_API_KEY}
spring.ai.google.genai.chat.options.model=gemini-flash-latest
spring.ai.google.genai.embedding.api-key=${SPRING_AI_GOOGLE_GENAI_EMBEDDING_API_KEY}
spring.ai.google.genai.embedding.text.options.model=gemini-embedding-001
spring.ai.google.genai.embedding.text.options.dimensions=768

# CORS — comma-separated list of allowed origins; "*" allows any origin (dev only)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# MCP Server
spring.ai.mcp.server.name=portfolio-mcp-server
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.type=SYNC

# Logging
logging.level.org.springframework.ai=INFO
